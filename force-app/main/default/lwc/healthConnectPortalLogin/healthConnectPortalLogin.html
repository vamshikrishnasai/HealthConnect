<template>
  <section class={cardClass} aria-label="Portal sign in">
    <template lwc:if={blueTheme}>
      <header class="login-heading">
        <p class="login-eyebrow">HEALTHCONNECT DOCTOR PORTAL</p>
        <h1>Doctor portal sign in</h1>
        <p>Sign in with your HealthConnect doctor account.</p>
      </header>
    </template>
    <form onsubmit={handleSubmit}>
      <label class="assistive-label" for="username">Username</label>
      <div class="credential-field">
        <svg
          class="credential-icon"
          data-icon="username"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c0-4.1 3.2-7 8-7s8 2.9 8 7"></path>
        </svg>
        <input
          id="username"
          class="credential-input"
          name="username"
          type="text"
          placeholder="Username"
          autocomplete="username"
          required
          oninput={handleUsernameInput}
        />
      </div>
      <label class="assistive-label" for="password">Password</label>
      <div class="credential-field">
        <svg
          class="credential-icon"
          data-icon="password"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <rect x="4" y="10" width="16" height="11" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          <path d="M12 14v3"></path>
        </svg>
        <input
          id="password"
          class="credential-input"
          name="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
          oninput={handlePasswordInput}
        />
      </div>
      <template lwc:if={errorMessage}>
        <p class="error-message" role="alert">{errorMessage}</p>
      </template>
      <button class="login-button" type="submit" disabled={isLoading}>
        {loginButtonText}
      </button>
      <nav class="login-links" aria-label="Account help">
        <a href={forgotPasswordHref}>{forgotPasswordLabel}</a>
        <template lwc:if={shouldShowSelfRegister}>
          <a href={selfRegisterHref}>{selfRegisterLabel}</a>
        </template>
      </nav>
    </form>
  </section>
</template>
